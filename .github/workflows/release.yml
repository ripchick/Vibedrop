name: Release builds

# Builds the release artifacts and publishes a GitHub Release on tag pushes (v*).
# The release itself is created by this workflow: push a tag such as v0.2.0 and the
# Windows zip + Linux tarball are built, attached and published automatically.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows release build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-release
      - name: cargo build --release
        run: cargo build --release --locked
      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/vibedrop.exe dist/vibedrop.exe
          Copy-Item README.md dist/ -ErrorAction SilentlyContinue
          Copy-Item LICENSE dist/ -ErrorAction SilentlyContinue
          Copy-Item CHANGELOG.md dist/ -ErrorAction SilentlyContinue
          Copy-Item THIRD_PARTY_NOTICES.md dist/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/* -DestinationPath vibedrop-windows-x64.zip -Force
          Get-ChildItem dist, vibedrop-windows-x64.zip | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: vibedrop-windows-x64
          path: vibedrop-windows-x64.zip
          if-no-files-found: error

  linux:
    name: Linux binary build (not a package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-release
      - name: cargo build --release
        run: cargo build --release --locked
      - name: Stage release files
        run: |
          mkdir -p dist
          cp target/release/vibedrop dist/vibedrop
          cp README.md LICENSE CHANGELOG.md THIRD_PARTY_NOTICES.md dist/
          tar -czf vibedrop-linux-x64.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: vibedrop-linux-x64
          path: vibedrop-linux-x64.tar.gz
          if-no-files-found: error

  # Note: this binary needs the desktop libraries on the target system
  # (libasound2, libxkbcommon-x11 etc.); distro packages (packaging/) are the
  # supported installation path, not this artifact.

  macos:
    name: macOS release build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-release
      - name: cargo build --release
        run: cargo build --release --locked
      - name: Stage release files
        run: |
          mkdir -p dist
          cp target/release/vibedrop dist/vibedrop
          cp README.md LICENSE CHANGELOG.md THIRD_PARTY_NOTICES.md dist/
          tar -czf vibedrop-macos-arm64.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: vibedrop-macos-arm64
          path: vibedrop-macos-arm64.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vibedrop-windows-x64
      - uses: actions/download-artifact@v4
        with:
          name: vibedrop-linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: vibedrop-macos-arm64
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            vibedrop-windows-x64.zip
            vibedrop-linux-x64.tar.gz
            vibedrop-macos-arm64.tar.gz
          body: |
            VibeDrop soundboard вЂ” desktop (Windows, Linux, macOS), Rust.
            See `README.md` / `README.ru.md` for details.

            Optional free virtual cable for voice chats (Windows):
            VB-CABLE (official freeware by VB-Audio) вЂ”
            https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip
            No driver ships inside VibeDrop itself.
          generate_release_notes: true
