[package]
name = "vibedrop"
version = "0.12.0"
edition = "2021"
description = "VibeDrop - a free open-source soundboard with dual audio output"
license = "Apache-2.0"
default-run = "vibedrop"

[lib]
name = "vibedrop"
path = "src/lib.rs"

[[bin]]
name = "vibedrop"
path = "src/main.rs"

[dependencies]
# Core (Part 1)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }

# GUI, audio and system integration
eframe = { version = "0.29", features = ["android-native-activity"] }
cpal = "0.15"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm", "isomp4", "aac", "alac"] }
global-hotkey = "0.6"
percent-encoding = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
winapi = { version = "0.3", features = ["fileapi", "handleapi", "winnt"] }

# File dialogs exist on desktop only (rfd has no Android backend).
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.15"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
winres = "0.1.12"