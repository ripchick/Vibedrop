plugins {
    id 'com.android.application'
}

// libvibedrop.so is built by Cargo into target/aarch64-linux-android/release.
// Set VIBEDROP_CARGO_LIB to point at another directory if needed.
def cargoLibDir = System.getenv("VIBEDROP_CARGO_LIB") ?:
        "${rootProject.projectDir}/../target/aarch64-linux-android/release"

android {
    namespace 'app.vibedrop.soundboard'
    compileSdk 34

    defaultConfig {
        applicationId 'app.vibedrop.soundboard'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.5.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = [cargoLibDir]
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}
