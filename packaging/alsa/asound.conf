# VibeDrop virtual cable for ALSA clients (installed by the vibedrop package).
# Playback goes into the cable's input side ("VibeDrop_Route", the VB-CABLE
# "CABLE Input" equivalent); capture reads the virtual microphone
# ("VibeDrop_Mic", the "CABLE Output" equivalent), so the in-app
# "Test microphone route" exercises the whole cable end to end. Requires the
# ALSA PipeWire plugin (libasound2-plugins / alsa-plugins-pipewire /
# alsa-plugins).
pcm.vibedrop_route {
	type pipewire
	playback_node "VibeDrop_Route"
	capture_node "VibeDrop_Mic"
	hint {
		show on
		description "VibeDrop Route (virtual cable)"
	}
}
